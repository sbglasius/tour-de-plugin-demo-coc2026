info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  codegen:
    defaultPackage: demo
  profile: web
  views:
    gsp:
      encoding: UTF-8
      codecs:
        scriptlet: html
dataSource:
  driverClassName: org.h2.Driver
  username: sa
  password: ''
  pooled: true
  jmxExport: true
environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
  test:
    dataSource:
      dbCreate: update
      url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
  production:
    dataSource:
      dbCreate: none
      url: jdbc:h2:./prodDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
---
# Mail goes to the port GreenMail is listening on. The plugin is enabled by
# default; set grails.plugin.greenmail.disabled to turn it off.
grails:
  mail:
    host: localhost
    port: 3025
    props:
      "mail.smtp.auth": false
  plugin:
    greenmail:
      ports:
        smtp: 3025

environments:
  test:
    # Integration tests use their own port, so they can run while the
    # development application is up and holding 3025.
    grails:
      mail:
        port: 3125
      plugin:
        greenmail:
          ports:
            smtp: 3125
